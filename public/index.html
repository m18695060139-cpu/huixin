<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>回信</title>
<meta name="description" content="每晚写一封信给明早的自己，回信替你整理好一切。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="回信">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" id="meta-theme">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/app.css?v=30">
<script>
  // 先把外观定下来再画页面，避免一开屏闪一下白
  (function () {
    try {
      var c = JSON.parse(localStorage.getItem('hx_cache') || 'null');
      var t = (c && c.settings && c.settings.theme) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'ink';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'ink'); }
  })();
</script>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js?v=30"></script>
</body>
</html>
