<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>回信</title>
<meta name="description" content="每晚写一封信，AI 替未来的你回信。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="回信">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" id="meta-theme">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon-v2.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css?v=7">
<script>
  // 先把外观定下来再画页面，避免一开屏闪一下白
  (function () {
    try {
      var c = JSON.parse(localStorage.getItem('hx_cache') || 'null');
      var t = (c && c.settings && c.settings.theme) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'ink';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'ink'); }
  })();
</script>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/poems.js?v=7"></script>
<script src="/app.js?v=7"></script>
</body>
</html>
